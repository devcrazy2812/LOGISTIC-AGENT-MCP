<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="450" fill="url(#glow)" />
  
  <!-- Cyber grid accents -->
  <path d="M 0 150 L 1200 150 M 0 300 L 1200 300 M 0 450 L 1200 450" stroke="#1f2937" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 300 0 L 300 630 M 600 0 L 600 630 M 900 0 L 900 630" stroke="#1f2937" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Logo Cube -->
  <g transform="translate(600, 200)">
    <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 0 -60 L 0 0 L 52 30 M 0 0 L -52 30" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#06b6d4"/>
  </g>

  <!-- Titles -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    LOGISWARM <tspan fill="#06b6d4">AI</tspan>
  </text>
  
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Autonomous Multi-Agent Logistics Swarm • Self-Healing Fleet Dispatcher
  </text>

  <!-- Feature Pills -->
  <g transform="translate(260, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="26" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="bold">MCP PROTOCOL</text>
    
    <!-- Pill 2 -->
    <rect x="200" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="310" y="26" font-family="monospace" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">MULTIMODAL VISION</text>
    
    <!-- Pill 3 -->
    <rect x="440" y="0" width="240" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="560" y="26" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">FEEDBACK LOOP AUDIT</text>
  </g>
</svg>
